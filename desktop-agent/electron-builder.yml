appId: com.greensglobal.plugin
productName: Plugin
copyright: Greens Global

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json

# Ship the supervisor service (built exe) + its admin install/uninstall scripts
# alongside the agent, so IT installs the service from the same package. Build the
# service first: `dotnet build service -c Release`, copy the exe into `service/`,
# then `npm run dist:win`. Lands in the install dir under resources\service\.
extraResources:
  - from: service
    to: service
    filter:
      - "NexusMonitorService.exe"
      - "*.ps1"
  # Silent auto-updater, run from a hidden scheduled task install.ps1 registers.
  # Lands at <installDir>\resources\updater\updater.ps1.
  - from: install/updater.ps1
    to: updater/updater.ps1

# active-win ships native helper binaries that must live outside the asar
# archive to be executable at runtime. The remote-support input sink is a
# PowerShell script - powershell.exe can't read from inside the asar either.
asarUnpack:
  - node_modules/active-win/**
  - src/inputsink.ps1

# Windows — per-machine MSI, for deployment as a MANAGED company application via
# Intune (or another MDM). A per-machine MSI installs under Program Files and can
# only be removed by an admin, so a standard employee (no local admin on a
# company-owned, managed device) cannot uninstall it. That enforcement comes from
# the device being company-managed - NOT from the app hiding or resisting the user.
# Point win.certificateFile / CSC_LINK at your code-signing cert before
# distributing, or installs show SmartScreen warnings.
win:
  target:
    - msi
  icon: build/icon.ico            # cobalt N tile; MSI target fails to link without one
msi:
  perMachine: true                # Program Files install; standard user can't remove
  oneClick: false
  runAfterFinish: false           # Intune (or the install command) provisions the
                                  # device token AFTER install, then starts the agent;
                                  # launching first would boot it with no token.
  # STABLE across versions so Intune upgrades in place instead of side-by-side.
  upgradeCode: "fd7e1521-5786-4bf1-99eb-ac30a1f91e88"

# macOS — dmg. Requires an Apple Developer ID cert + notarization to run
# without Gatekeeper blocking. Screen Recording permission is prompted once
# by macOS on first capture (unavoidable OS consent gate).
mac:
  target:
    - dmg
  category: public.app-category.business
  # icon: build/icon.icns
  extendInfo:
    NSScreenCaptureUsageDescription: >-
      Greens Nexus captures your screen only while you are clocked in, per your
      employment agreement, for time-and-activity records.

# Auto-update feed. Fill in when you have a hosting location (e.g. a Supabase
# storage bucket, S3, or GitHub Releases) and uncomment electron-updater usage.
# publish:
#   provider: generic
#   url: https://updates.nexus.greensglobal.com/agent
