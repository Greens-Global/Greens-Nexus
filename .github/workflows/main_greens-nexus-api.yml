name: Build and deploy Python app to Azure Web App - greens-nexus-api

# Zero-downtime deploys (Jul 2026): deploy to a STAGING slot, warm it, verify
# /health on the new code, then swap slots — the old process keeps serving
# until the new one is proven healthy, so users never see the 3-4 minute
# restart window that in-place deploys caused (500s on every release).
#
# REQUIREMENT: deployment slots need the App Service plan at Standard S1 or
# higher. Until the plan is upgraded, the "Ensure staging slot" step fails
# gracefully and the workflow falls back to the old in-place deploy (with a
# warning in the run) — releases keep working either way.

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  APP_NAME: greens-nexus-api
  SLOT: staging

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r backend/requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend/
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA9535E6EC75412C8D1945C35FFCAE24 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1FC35A94CA25435AA95CC7312709E6CC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7349AA0EE36341E6B6E29280C4EC2511 }}

      - name: Resolve resource group
        id: rg
        run: |
          RG=$(az webapp list --query "[?name=='$APP_NAME'].resourceGroup" -o tsv)
          echo "Resource group: $RG"
          echo "rg=$RG" >> "$GITHUB_OUTPUT"

      - name: Enable Always On + health check on production (idempotent)
        continue-on-error: true
        run: |
          az webapp config set -g "${{ steps.rg.outputs.rg }}" -n "$APP_NAME" --always-on true
          az webapp config set -g "${{ steps.rg.outputs.rg }}" -n "$APP_NAME" --generic-configurations '{"healthCheckPath": "/health"}'

      - name: Ensure staging slot exists (needs Standard S1+ plan)
        id: slot
        run: |
          RG="${{ steps.rg.outputs.rg }}"
          if az webapp deployment slot list -g "$RG" -n "$APP_NAME" --query "[?name=='$SLOT'].name" -o tsv | grep -q "$SLOT"; then
            echo "Slot exists."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif az webapp deployment slot create -g "$RG" -n "$APP_NAME" --slot "$SLOT" --configuration-source "$APP_NAME"; then
            echo "Slot created."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not create the staging slot (App Service plan below Standard S1?). Falling back to IN-PLACE deploy — prod will restart for a few minutes. Upgrade the plan to enable zero-downtime deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # The API refuses to start on Azure without NEXUS_VAULT_KEY (secret_box,
      # Oct 6). The staging slot copied production's settings once, in July,
      # and never got the key - so the Oct 6 release (#456) crash-looped on
      # staging and was never swapped in. Give staging production's key before
      # every deploy. It MUST be the same value: sessions and stored tokens are
      # encrypted with it, and the swap puts this code in front of them.
      # Sticky on the slot (--slot-settings), so a swap never moves it.
      - name: Give the staging slot production's vault key
        if: steps.slot.outputs.ready == 'true'
        run: |
          RG="${{ steps.rg.outputs.rg }}"
          KEY=$(az webapp config appsettings list -g "$RG" -n "$APP_NAME" --query "[?name=='NEXUS_VAULT_KEY'].value | [0]" -o tsv)
          if [ -z "$KEY" ]; then
            echo "::error::Production has no NEXUS_VAULT_KEY (or this login cannot read it) - the new code would refuse to start. Set it on greens-nexus-api first."
            exit 1
          fi
          echo "::add-mask::$KEY"
          CUR=$(az webapp config appsettings list -g "$RG" -n "$APP_NAME" --slot "$SLOT" --query "[?name=='NEXUS_VAULT_KEY'].value | [0]" -o tsv)
          if [ -n "$CUR" ]; then echo "::add-mask::$CUR"; fi
          if [ "$CUR" = "$KEY" ]; then
            echo "Staging already has production's vault key."
          else
            az webapp config appsettings set -g "$RG" -n "$APP_NAME" --slot "$SLOT" --slot-settings NEXUS_VAULT_KEY="$KEY" -o none
            echo "Staging slot vault key set from production."
          fi

      - name: Start staging slot for this deploy
        if: steps.slot.outputs.ready == 'true'
        continue-on-error: true
        run: az webapp start -g "${{ steps.rg.outputs.rg }}" -n "$APP_NAME" --slot "$SLOT"

      - name: Deploy to staging slot
        if: steps.slot.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'greens-nexus-api'
          slot-name: 'staging'

      - name: Warm staging and verify health of the NEW code
        if: steps.slot.outputs.ready == 'true'
        run: |
          RG="${{ steps.rg.outputs.rg }}"
          HOST=$(az webapp show -g "$RG" -n "$APP_NAME" --slot "$SLOT" --query defaultHostName -o tsv)
          echo "Warming https://$HOST/health"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$HOST/health") || code=000
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Staging never became healthy — NOT swapping. Production is untouched and still running the previous version."
          exit 1

      # A crash-looping staging slot only ever answers 000/503 above; its own
      # startup log says why (a FATAL line, a traceback). Print a minute of it
      # into this run instead of making someone open the portal.
      - name: Show the staging slot's startup log (only when it never got healthy)
        if: failure() && steps.slot.outputs.ready == 'true'
        continue-on-error: true
        run: |
          timeout 60 az webapp log tail -g "${{ steps.rg.outputs.rg }}" -n "$APP_NAME" --slot "$SLOT" 2>&1 | tail -n 120 || true

      - name: Swap staging into production (zero downtime)
        if: steps.slot.outputs.ready == 'true'
        run: |
          az webapp deployment slot swap -g "${{ steps.rg.outputs.rg }}" -n "$APP_NAME" --slot "$SLOT" --target-slot production

      - name: Verify production health after swap
        if: steps.slot.outputs.ready == 'true'
        run: |
          RG="${{ steps.rg.outputs.rg }}"
          HOST=$(az webapp show -g "$RG" -n "$APP_NAME" --query defaultHostName -o tsv)
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$HOST/health") || code=000
            echo "attempt $i: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Production unhealthy after swap — swap back with: az webapp deployment slot swap -g $RG -n $APP_NAME --slot staging --target-slot production"
          exit 1

      # The slot's only job is deploy-time verification. Left running it would
      # hold a second full app against the SAME production database (double
      # connection pools — Jul 24: intermittent "too many clients" 500s) and
      # double-run background jobs (ticket emails, HR reminders). Stop it once
      # the swap is verified; the next deploy starts it again. To roll back a
      # bad release: az webapp start --slot staging, then swap.
      - name: Stop staging slot until the next deploy
        if: steps.slot.outputs.ready == 'true'
        continue-on-error: true
        run: az webapp stop -g "${{ steps.rg.outputs.rg }}" -n "$APP_NAME" --slot "$SLOT"

      # Fallback path — plan below Standard: old in-place deploy (restarts prod).
      - name: Deploy to Azure Web App (in-place fallback)
        if: steps.slot.outputs.ready != 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'greens-nexus-api'
          slot-name: 'Production'
