# Post-deploy gate.
#
# Nothing else in this repo loads the DEPLOYED site in a browser: ci.yml is lint
# only, qa-e2e.yml serves a local build (so it never sees _headers or the real
# CSP), and uptime.yml historically only asserted HTTP 200 - which the SPA
# fallback returns happily while the app is a white screen. Every frontend
# incident this month was therefore found by a person, not by CI.
#
# This waits for /version.json to report the exact commit that just shipped, then
# asserts the real thing: the app renders, no CSP/module errors, every hashed
# asset serves real JS (not the SPA fallback), the PDF engine is still framable,
# and every unhashed public/ file carries a ?v= stamp. That last one is not
# academic - guard.js, the boot watchdog, silently went un-updatable for weeks
# because it is unhashed and Pages serves it with a year-long max-age.
#
# A red run means: roll back in the Cloudflare dashboard (Pages > project >
# Deployments > previous > Rollback), then fix forward.
name: Verify deploy

on:
  push:
    branches: ["dev", "main"]
    # Backend-only and docs-only changes cannot break the frontend deploy.
    paths:
      - "frontend/**"
      - ".github/workflows/verify-deploy.yml"
      - "e2e/verify-deployed.mjs"
  workflow_dispatch:

concurrency:
  # Never let two runs race; a newer deploy supersedes an older verification.
  group: verify-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install verifier
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Pick the target for this branch
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "base=https://nexus.greensglobal.com" >> "$GITHUB_OUTPUT"
          else
            echo "base=https://dev.nexus.greensglobal.com" >> "$GITHUB_OUTPUT"
          fi

      # Cloudflare Pages builds dev from git and prod from deploy-cloudflare.yml;
      # either way the wait is on /version.json reporting this sha, so we do not
      # need to know which pipeline is publishing.
      - name: Verify the deployed site
        working-directory: e2e
        run: |
          node verify-deployed.mjs \
            --base "${{ steps.target.outputs.base }}" \
            --build-id "${{ github.sha }}" \
            --timeout 420

      - name: Flag a bad production deploy
        if: failure() && github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Verify deploy: production is unhealthy';
            const body = [
              `Post-deploy verification failed for \`${context.sha.slice(0, 12)}\` on **main**.`,
              '',
              `[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              'Roll back first (Cloudflare dashboard > Pages > project > Deployments >',
              'the previous deployment > Rollback), then fix forward.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-health',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['deploy-health'],
              });
            }
