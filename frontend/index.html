<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus</title>
    <!-- The tab icon is the Nexus ring mark (Pranshu, 11/15/2026), written by
         scripts/make-brand-assets.py. A named icon also stops the browser's
         default /favicon.ico probe. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-32.png">
    <!-- Installable app (Frontline Reach, Nov 2026): the manifest makes Nexus
         install to a phone's home screen; the touch icon is what iOS shows
         there (it has no manifest icon support); theme-color tints the
         browser chrome. The service worker behind push is registered by
         src/lib/pwa.js after sign-in. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexus">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png">
    <!-- Fonts: Inter, the one Nexus font, is bundled with the app
         (src/fonts.css) - never loaded from Google (Neil, 11/12/2026). -->
    <!-- Boot guard must be an EXTERNAL script: the CSP (script-src 'self')
         blocks inline scripts, which silently disabled the previous inline
         version of this watchdog (Jul 28 incident). -->
    <script src="/guard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
