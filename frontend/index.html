<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus</title>
    <!-- Inline data-URI favicon: renders with zero network requests and stops
         the browser's default /favicon.ico probe (which 404'd on every load).
         Mirrors the login "N" badge; /favicon.svg holds the same mark on disk. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%23248f4b'/%3E%3Cpath%20fill='%23fff'%20d='M19%2046V18h8l10%2017V18h8v28h-8L27%2029v17z'/%3E%3C/svg%3E">
    <!-- Installable app (Frontline Reach, Nov 2026): the manifest makes Nexus
         install to a phone's home screen; the touch icon is what iOS shows
         there (it has no manifest icon support); theme-color tints the
         browser chrome. The service worker behind push is registered by
         src/lib/pwa.js after sign-in. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#248f4b" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Nexus">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter + Plus Jakarta Sans: legacy modules. Figtree: the Work OS
         surfaces (login, home, shell) — see DESIGN.md. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Boot guard must be an EXTERNAL script: the CSP (script-src 'self')
         blocks inline scripts, which silently disabled the previous inline
         version of this watchdog (Jul 28 incident). -->
    <script src="/guard.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
