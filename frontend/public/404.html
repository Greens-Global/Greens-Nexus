     only if they hit a truly dead link while assets are the target. -->

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found — Greens Nexus</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f2f4f8; color: #1d2139;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    main { text-align: center; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { font-size: 14px; color: #6b7280; margin: 0; }
    a { color: #2b45e1; }
  </style>
</head>
<body>
  <main>
    <h1>That file isn&rsquo;t here</h1>
    <p>If the app just updated, this resolves itself — <a href="/">reload Nexus</a>.</p>
  </main>
</body>
</html>
